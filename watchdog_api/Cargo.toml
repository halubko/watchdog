[package]
name = "watchdog_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "watchdog_api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
uuid = { version ="1.24.0", features = ["v4", "serde"]}
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }

watchdog_config = { path = "../watchdog_config" }
watchdog_db = { path = "../watchdog_db" }
watchdog_core = { path = "../watchdog_core" }
