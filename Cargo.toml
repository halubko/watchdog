[workspace]
members = ["watchdog_api", "watchdog_config", "watchdog_db", "watchdog_core", "watchdog_scheduler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
uuid = { version ="1.24.0", features = ["v4", "serde"]}
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = {version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono"]}
dotenvy = "0.15.7"
envy = "0.4.2"
reqwest = "0.13.4"

watchdog_config = { path = "../watchdog_config" }
watchdog_db = { path = "../watchdog_db" }
watchdog_core = { path = "../watchdog_core" }
watchdog_scheduler = { path = "../watchdog_scheduler" }